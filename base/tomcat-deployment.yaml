apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      containers:
      - name: tomcat
        image: 554304941374.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic_btc:latest
        ports:
        - containerPort: 8080